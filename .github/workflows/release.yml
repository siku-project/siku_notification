name: release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Build web
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Assemble package
        run: |
          mkdir -p package/siku_notification/web
          for entry in client server shared config translations fxmanifest.lua README.md; do
            if [ -e "$entry" ]; then
              cp -r "$entry" package/siku_notification/
            fi
          done
          cp -r web/dist package/siku_notification/web/dist
          cd package
          zip -r ../siku_notification.zip siku_notification

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" siku_notification.zip --clobber
